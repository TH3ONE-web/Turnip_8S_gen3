name: Build Turnip Adreno 735

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-mako glslang-tools zip ccache flex bison libx11-dev libwayland-dev libdrm-dev

      - name: Instalar Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Descargar Mesa 3D
        run: |
          git clone --depth 1 https://github.com/mesa3D/mesa.git

      - name: Crear Cross-File
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          cat << EOF > android-aarch64.txt
          [binaries]
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = ['ccache', '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang']
          cpp = ['ccache', '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++']
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Compilar Turnip
        run: |
          cd mesa
          meson setup build-android \
            --cross-file ../android-aarch64.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release
          ninja -C build-android

      - name: Empaquetar Driver
        run: |
          mkdir output
          cp mesa/build-android/src/freedreno/vulkan/libvulkan_freedreno.so output/vulkan.ad0735.so
          cat << 'EOF' > output/meta.json
          {
            "schemaVersion": 1,
            "name": "Turnip-8sGen3-BO2",
            "description": "Driver Turnip para Snapdragon 8s Gen 3",
            "author": "TH3ONE-web",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Mesa-Latest",
            "minApi": 28,
            "libraryName": "vulkan.ad0735.so"
          }
          EOF
          cd output
          zip -r ../Turnip_8sGen3_BO2.zip vulkan.ad0735.so meta.json

      - name: Subir ZIP compilado
        uses: actions/upload-artifact@v4
        with:
          name: Turnip_8sGen3_BO2
          path: Turnip_8sGen3_BO2.zip
